
name: CI/CD - Build and Deploy Node.js App to DockerHub

# Trigger the workflow only when code is pushed to the 'main' branch
on:
  push:
    branches:
      - main

jobs:
  # -------------------------------
  # 1️⃣ BUILD JOB
  # -------------------------------
  build:
    runs-on: ubuntu-latest # Run this job on the latest Ubuntu environment

    steps:
      # Step 1: Checkout the code from the GitHub repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Node.js (Specify the version you need, e.g., 18)
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # Step 3: Install Node.js dependencies
      - name: Install dependencies
        run: |
          npm install

      # Step 4: Build the Docker image and push it to Docker Hub
      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }} # Docker Hub username
          password: ${{ secrets.DOCKERHUB_TOKEN }} # Docker Hub access token

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: . # Build context is current directory
          push: true # Push image after building
          tags: gwebpro/actyvate-chat-ui:latest # Tag used for Docker image

      # Step 5: Clean up local Docker environment on runner (optional)
      - name: Clean up
        run: docker system prune -f

  # -------------------------------
  # 2️⃣ DEPLOY JOB
  # -------------------------------
  deploy:
    needs: build # This job runs only after 'build' job completes successfully
    runs-on: ubuntu-latest

    steps:
      # Step 1: Connect to your server using SSH and deploy the latest Docker image with docker-compose
      - name: Deploy to Server via SSH using Docker Compose
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }} # IP address of your server
          username: ubuntu # Username to SSH as
          key: ${{ secrets.SERVER_SSH_KEY }} # SSH private key (add to GitHub secrets)

          script: |
            # Change to the directory where your docker-compose.yml is located
            cd ~/chat-ui
            
            # Pull the latest Docker image from Docker Hub
            sudo docker pull gwebpro/actyvate-chat-ui:latest
            
            # Stop and remove any existing containers using docker-compose
            sudo docker-compose down

            # Start the containers in detached mode using docker-compose
            sudo docker-compose up -d
